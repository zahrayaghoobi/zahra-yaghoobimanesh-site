name: Import project archive
on:
  push:
    paths:
      - project-upload.zip
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand and commit project files
        run: |
          unzip -q project-upload.zip -d .
          rm project-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import portfolio project"
          git push
